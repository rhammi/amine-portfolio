<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Robotino two-sensor route-following logic</title>
  <desc id="desc">English engineering diagram showing the two inductive sensors, the metallic tape threshold, and the four binary control states.</desc>
  <rect width="1600" height="900" rx="36" fill="#f8fafc"/>
  <rect x="38" y="38" width="1524" height="824" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#c2410c" letter-spacing="3">CONTROL EVIDENCE</text>
  <text x="90" y="168" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#0f172a">Two sensors, four deterministic states</text>

  <g transform="translate(90 230)">
    <rect width="500" height="455" rx="28" fill="#0f172a"/>
    <path d="M55 365 C140 300 145 160 248 105 C330 61 395 104 451 54" fill="none" stroke="#f8fafc" stroke-width="28" stroke-linecap="round"/>
    <path d="M55 365 C140 300 145 160 248 105 C330 61 395 104 451 54" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <circle cx="272" cy="235" r="122" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="272" cy="235" r="64" fill="#cbd5e1"/>
    <path d="M248 339 L296 339" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    <path d="M248 131 L296 131" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    <circle cx="250" cy="128" r="17" fill="#22c55e" stroke="#fff" stroke-width="5"/>
    <circle cx="275" cy="196" r="17" fill="#22c55e" stroke="#fff" stroke-width="5"/>
    <path d="M365 116 L315 129" stroke="#fdba74" stroke-width="3"/>
    <path d="M365 184 L315 196" stroke="#fdba74" stroke-width="3"/>
    <text x="348" y="124" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">Front sensor</text>
    <text x="348" y="192" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">Centre sensor</text>
    <text x="38" y="420" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1">Green = metallic tape detected</text>
  </g>

  <g transform="translate(650 230)" font-family="Arial, sans-serif">
    <rect width="860" height="455" rx="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="860" height="70" rx="28" fill="#0f172a"/>
    <path d="M0 42 H860 V70 H0Z" fill="#0f172a"/>
    <text x="34" y="46" font-size="22" font-weight="700" fill="#fff">Front</text>
    <text x="153" y="46" font-size="22" font-weight="700" fill="#fff">Centre</text>
    <text x="292" y="46" font-size="22" font-weight="700" fill="#fff">Interpreted state</text>
    <text x="568" y="46" font-size="22" font-weight="700" fill="#fff">Controller response</text>
    <g font-size="21" fill="#334155">
      <line x1="0" y1="166" x2="860" y2="166" stroke="#cbd5e1"/>
      <line x1="0" y1="262" x2="860" y2="262" stroke="#cbd5e1"/>
      <line x1="0" y1="358" x2="860" y2="358" stroke="#cbd5e1"/>
      <line x1="120" y1="70" x2="120" y2="455" stroke="#cbd5e1"/>
      <line x1="260" y1="70" x2="260" y2="455" stroke="#cbd5e1"/>
      <line x1="535" y1="70" x2="535" y2="455" stroke="#cbd5e1"/>
      <text x="50" y="131" font-size="30" font-weight="800" fill="#0f766e">1</text>
      <text x="176" y="131" font-size="30" font-weight="800" fill="#0f766e">1</text>
      <text x="292" y="123" font-weight="700" fill="#0f172a">Tape held</text>
      <text x="568" y="123" font-weight="700" fill="#0f172a">Drive forward</text>
      <text x="50" y="227" font-size="30" font-weight="800" fill="#2563eb">1</text>
      <text x="176" y="227" font-size="30" font-weight="800" fill="#94a3b8">0</text>
      <text x="292" y="219" font-weight="700" fill="#0f172a">Front only</text>
      <text x="568" y="210" font-weight="700" fill="#0f172a">Curve to reacquire</text>
      <text x="568" y="238" fill="#475569">the centre sensor</text>
      <text x="50" y="323" font-size="30" font-weight="800" fill="#94a3b8">0</text>
      <text x="176" y="323" font-size="30" font-weight="800" fill="#2563eb">1</text>
      <text x="292" y="315" font-weight="700" fill="#0f172a">Centre only</text>
      <text x="568" y="306" font-weight="700" fill="#0f172a">Reorient to restore</text>
      <text x="568" y="334" fill="#475569">front-sensor alignment</text>
      <text x="50" y="419" font-size="30" font-weight="800" fill="#94a3b8">0</text>
      <text x="176" y="419" font-size="30" font-weight="800" fill="#94a3b8">0</text>
      <text x="292" y="411" font-weight="700" fill="#0f172a">Tape lost</text>
      <text x="568" y="402" font-weight="700" fill="#0f172a">Run remembered-direction</text>
      <text x="568" y="430" fill="#475569">or discontinuity search</text>
    </g>
  </g>

  <g transform="translate(90 736)" font-family="Arial, sans-serif">
    <rect width="1420" height="80" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="30" y="34" font-size="20" font-weight="800" fill="#9a3412">CALIBRATED DECISION</text>
    <text x="30" y="61" font-size="20" fill="#7c2d12">Raw sensor ≈ 2–4 over tape and ≈ 9 away from tape</text>
    <path d="M590 41 H945" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
    <path d="M590 41 H768" stroke="#22c55e" stroke-width="12" stroke-linecap="round"/>
    <circle cx="768" cy="41" r="17" fill="#c2410c" stroke="#fff" stroke-width="5"/>
    <text x="744" y="73" font-size="18" font-weight="700" fill="#9a3412">5</text>
    <text x="1000" y="49" font-size="21" font-weight="700" fill="#0f172a">1 = tape detected · 0 = tape absent</text>
  </g>
</svg>
