<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FESTO press and pick-and-place station handshake</title>
  <desc id="desc">English functional diagram showing the three inter-station signals and safe transfer sequence documented in the GEI1087 report.</desc>
  <rect width="1600" height="900" rx="36" fill="#f8fafc"/>
  <rect x="40" y="40" width="1520" height="820" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#c2410c" letter-spacing="3">IMPLEMENTED SCOPE</text>
  <text x="90" y="168" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#0f172a">Two PLCs, one explicit transfer contract</text>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="238" width="500" height="270" rx="28" fill="#0f172a"/>
    <circle cx="165" cy="315" r="34" fill="#f97316"/>
    <path d="M147 315 H183 M165 297 V333" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="220" y="305" font-size="26" font-weight="700" fill="#fdba74">STATION A</text>
    <text x="220" y="350" font-size="38" font-weight="800" fill="#fff">Pick &amp; Place</text>
    <text x="135" y="410" font-size="22" fill="#cbd5e1">Conveyor · vertical slide · vacuum grip</text>
    <text x="135" y="450" font-size="22" fill="#cbd5e1">MicroLogix 1100 · local GRAFCET</text>

    <rect x="1010" y="238" width="500" height="270" rx="28" fill="#0f172a"/>
    <circle cx="1085" cy="315" r="34" fill="#22c55e"/>
    <path d="M1067 315 H1103 M1085 297 V333" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="1140" y="305" font-size="26" font-weight="700" fill="#86efac">STATION B</text>
    <text x="1140" y="350" font-size="38" font-weight="800" fill="#fff">Press</text>
    <text x="1055" y="410" font-size="22" fill="#cbd5e1">Rotary arm · linear actuator · clamp</text>
    <text x="1055" y="450" font-size="22" fill="#cbd5e1">MicroLogix 1100 · local GRAFCET</text>

    <path d="M590 292 H990" stroke="#f97316" stroke-width="8" marker-end="url(#arrowOrange)"/>
    <rect x="660" y="245" width="264" height="66" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="792" y="274" text-anchor="middle" font-size="18" font-weight="800" fill="#9a3412">TRANSFER REQUEST</text>
    <text x="792" y="298" text-anchor="middle" font-size="17" fill="#7c2d12">station ready / automatic</text>

    <path d="M1010 378 H610" stroke="#0f766e" stroke-width="8" marker-end="url(#arrowGreen)"/>
    <rect x="675" y="332" width="250" height="66" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="800" y="361" text-anchor="middle" font-size="18" font-weight="800" fill="#065f46">POSITION READY</text>
    <text x="800" y="385" text-anchor="middle" font-size="17" fill="#065f46">press arm at reception</text>

    <path d="M590 463 H990" stroke="#64748b" stroke-width="8" marker-end="url(#arrowSlate)"/>
    <rect x="674" y="417" width="252" height="66" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="800" y="446" text-anchor="middle" font-size="18" font-weight="800" fill="#334155">CLOSE / STOP</text>
    <text x="800" y="470" text-anchor="middle" font-size="17" fill="#475569">leave automatic operation</text>

    <text x="90" y="594" font-size="24" font-weight="800" fill="#0f172a">Safe sequence encoded in the revised GRAFCETs</text>
    <g transform="translate(90 635)">
      <g>
        <circle cx="35" cy="35" r="35" fill="#c2410c"/><text x="35" y="44" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">1</text>
        <text x="90" y="28" font-size="20" font-weight="800" fill="#0f172a">Declare readiness</text><text x="90" y="56" font-size="18" fill="#475569">Request the next transfer.</text>
      </g>
      <path d="M340 35 H410" stroke="#cbd5e1" stroke-width="5" marker-end="url(#arrowLight)"/>
      <g transform="translate(430)">
        <circle cx="35" cy="35" r="35" fill="#0f766e"/><text x="35" y="44" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">2</text>
        <text x="90" y="28" font-size="20" font-weight="800" fill="#0f172a">Confirm position</text><text x="90" y="56" font-size="18" fill="#475569">Arm at the reception position.</text>
      </g>
      <path d="M790 35 H860" stroke="#cbd5e1" stroke-width="5" marker-end="url(#arrowLight)"/>
      <g transform="translate(880)">
        <circle cx="35" cy="35" r="35" fill="#2563eb"/><text x="35" y="44" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">3</text>
        <text x="90" y="28" font-size="20" font-weight="800" fill="#0f172a">Permit motion</text><text x="90" y="56" font-size="18" fill="#475569">Move only after both signals.</text>
      </g>
    </g>
    <rect x="90" y="760" width="1420" height="62" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="120" y="800" font-size="20" font-weight="700" fill="#7c2d12">Fail-safe branch: a close/stop signal returns the press to its initial safe waiting state.</text>
  </g>
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f97316"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#cbd5e1"/></marker>
  </defs>
</svg>
